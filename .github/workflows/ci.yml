name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Codex for offline client integration
        run: npm install --global @openai/codex@0.163.0
      - run: npm run check
      - run: npm test
        env:
          WORKBUDDY_CODEX_REQUIRED: '1'
